name: Compliance

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/compliance.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - "scripts/generate_license_artifacts.py"
      - "scripts/license-policy.json"
      - "LICENSE"
      - "NOTICE"
      - "MODEL_LICENSES.md"
      - "THIRD_PARTY_LICENSES.md"
      - "THIRD_PARTY_NOTICES.txt"

permissions:
  contents: read

concurrency:
  group: compliance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licenses:
    name: Verify dependency licenses and package contents
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@ed21f2f24f8dd64503750218de024bcf64c7250a # v7.1.5
        with:
          version: "0.9.2"
          enable-cache: true
      - name: Create frozen CPU production environment
        run: uv sync --frozen --no-dev --extra cpu
      - name: Verify license policy and generated artifacts
        run: |
          uv run --no-sync python scripts/generate_license_artifacts.py \
            --python .venv/bin/python \
            --check \
            --sbom-output "$RUNNER_TEMP/nota-asr-server-linux-python.bom.cyclonedx.json"
      - name: Upload generated Linux Python SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nota-asr-server-linux-python-sbom
          path: ${{ runner.temp }}/nota-asr-server-linux-python.bom.cyclonedx.json
          retention-days: 14
      - name: Verify wheel and source distribution contents
        run: |
          uv build
          python - <<'PY'
          import tarfile
          import zipfile
          from pathlib import Path

          wheel = next(Path("dist").glob("*.whl"))
          required = {"LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md", "THIRD_PARTY_NOTICES.txt", "MODEL_LICENSES.md"}
          with zipfile.ZipFile(wheel) as archive:
              names = {Path(name).name for name in archive.namelist()}
          missing = required - names
          if missing:
              raise SystemExit(f"Wheel is missing legal files: {sorted(missing)}")

          sdist = next(Path("dist").glob("*.tar.gz"))
          with tarfile.open(sdist) as archive:
              names = {Path(name).name for name in archive.getnames()}
          missing = required - names
          if missing:
              raise SystemExit(f"Source distribution is missing legal files: {sorted(missing)}")
          PY
