services:
  nota-asr-server:
    build: .
    image: nota-asr-server:local
    ports:
      - "${NOTA_HOST_PORT:-8010}:8010"
    environment:
      NOTA_DEVICE: "${NOTA_DEVICE:-cpu}"
      NOTA_PRELOAD_MODEL: "${NOTA_PRELOAD_MODEL:-sensevoice}"
      NOTA_ENABLED_MODELS: "${NOTA_ENABLED_MODELS:-sensevoice,paraformer}"
      NOTA_MODEL_DIR: /app/models
      NOTA_API_KEYS: "${NOTA_API_KEYS:-}"
    volumes:
      - ./models:/app/models
    shm_size: "2gb"
