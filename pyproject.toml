[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nota-asr-server"
version = "0.2.0"
description = "Stable OpenAI-compatible ASR service for the Nota meeting recorder"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = [
    "LICENSE",
    "NOTICE",
    "THIRD_PARTY_LICENSES.md",
    "THIRD_PARTY_NOTICES.txt",
    "MODEL_LICENSES.md",
    "bom.cyclonedx.json",
]
dependencies = [
    "funasr==1.3.30",
    "fastapi>=0.115,<1",
    "numpy>=1.24,<3",
    "python-dotenv>=1,<2",
    "python-multipart>=0.0.9,<1",
    "scikit-learn>=1.5,<2",
    "scipy>=1.10,<2",
    "soundfile>=0.12,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.urls]
Repository = "https://github.com/kwp-lab/nota-asr-server"

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
]
cpu = [
    "torch==2.11.0+cpu",
    "torchaudio==2.11.0+cpu",
]

[project.scripts]
nota-asr-server = "nota_asr_server.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
