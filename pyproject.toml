[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nota-asr-server"
version = "0.1.0"
description = "Stable OpenAI-compatible ASR service for the Nota meeting recorder"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
dependencies = [
    "funasr==1.3.30",
    "fastapi>=0.115,<1",
    "numpy>=1.24,<3",
    "python-multipart>=0.0.9,<1",
    "scikit-learn>=1.5,<2",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
]

[project.scripts]
nota-asr-server = "nota_asr_server.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
